<!DOCTYPE html>
<html>
<head>
    <title>PDF Page Preview</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #ccc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .page-container {
            margin-bottom: 40px;
            background: #2a2a2a;
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-align: center;
        }
        .page-container h3 {
            margin-top: 0;
            color: #fff;
        }
        img {
            max-width: 100%;
            height: auto;
            border: 1px solid #444;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>PDF Scanned Page Previews</h1>

    <div class="page-container">
        <h3>Page 01</h3>
        <img src="resized/page_01.png" alt="Page page_01.png">
    </div>

    <div class="page-container">
        <h3>Page 02</h3>
        <img src="resized/page_02.png" alt="Page page_02.png">
    </div>

    <div class="page-container">
        <h3>Page 03</h3>
        <img src="resized/page_03.png" alt="Page page_03.png">
    </div>

</body>
</html>
